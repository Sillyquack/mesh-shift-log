name: Temporary one-tap fridge standard upgrade

on:
  push:
    branches:
      - agent/production-candidate-experience

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message == 'ci: apply one-tap fridge standard upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-candidate-experience
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make saved fridge standards the primary count path
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          experience_path = Path('src/components/InventoryCounterExperience.jsx')
          experience = experience_path.read_text()

          standard_component = r'''function StandardMatchPanel({
            assignment,
            summary,
            busy,
            onApply,
            onManualCount,
          }) {
            const locationName = assignment?.location?.name || 'this location';
            const locationKind = normalized(assignment?.location?.locationType) === 'fridge'
              || /\bfridge\b/.test(normalized(locationName))
              ? 'fridge'
              : 'location';
            const incompleteWithoutStandard = summary.incomplete.filter(
              (line) => line.standardQuantityExact === null,
            );
            const hasSavedDeviation = summary.deviations.length > 0;
            const hasUnsafeDrafts = summary.unsafeDrafts.length > 0;
            const canApply = summary.incomplete.length > 0
              && incompleteWithoutStandard.length === 0
              && !hasSavedDeviation
              && !hasUnsafeDrafts
              && !busy;

            return (
              <section className="mesh-focus-card counter-experience-standard-decision" aria-label={`Fast count ${locationName}`}>
                <div className="counter-experience-standard-decision-heading">
                  <div>
                    <span className="mesh-section-label">Fast count</span>
                    <h2>Does this {locationKind} match its saved standard?</h2>
                    <p>
                      Check every product in {locationName}. When everything is stocked exactly to its saved standard,
                      one tap counts this {locationKind} and opens Review.
                    </p>
                  </div>
                  <span className="counter-experience-standard-mark" aria-hidden="true">✓</span>
                </div>

                {incompleteWithoutStandard.length > 0 ? (
                  <p className="counter-experience-inline-warning">
                    {incompleteWithoutStandard.length} {incompleteWithoutStandard.length === 1 ? 'product has' : 'products have'} no saved standard.
                    Count manually or ask Bobby to complete this {locationKind} standard.
                  </p>
                ) : null}
                {hasSavedDeviation ? (
                  <p className="counter-experience-inline-warning">
                    This {locationKind} already contains a saved deviation. Continue with the manual count so it is not hidden.
                  </p>
                ) : null}
                {hasUnsafeDrafts ? (
                  <p className="counter-experience-inline-warning">
                    Save or resolve the local entries before using the saved standard.
                  </p>
                ) : null}

                <div className="counter-experience-standard-actions">
                  <button
                    type="button"
                    className="mesh-primary-action"
                    disabled={!canApply}
                    onClick={onApply}
                  >
                    {busy ? 'Counting…' : `Done — ${locationKind} matches standard`}
                  </button>
                  <button
                    type="button"
                    className="mesh-secondary-action"
                    disabled={busy}
                    onClick={onManualCount}
                  >
                    No — count differences
                  </button>
                </div>
                <small>
                  By tapping Done, you confirm that you physically checked this entire {locationKind}. The same product in another fridge remains a separate count.
                  Existing saved values, notes and deviations are never overwritten.
                </small>
              </section>
            );
          }

          function CountNavigation'''

          experience, count = re.subn(
            r"function ExactStandardPanel\(\{[\s\S]*?\n\}\n\nfunction CountNavigation",
            standard_component,
            experience,
            count=1,
          )
          if count != 1:
            raise SystemExit(f'Expected one ExactStandardPanel replacement, got {count}')

          experience = experience.replace(
            "  const [physicalConfirmation, setPhysicalConfirmation] = useState(false);\n",
            "",
          )
          experience = experience.replace("    setPhysicalConfirmation(false);\n", "")
          experience = experience.replace(
            "                  ? 'Count what is physically in front of you. Save one product, then move to the next.'",
            "                  ? 'Open one location, check it against its saved standard first, and tap Done when it matches. Count products manually only when something is different.'",
          )

          apply_start = experience.index("  const applyDefault = async () => {")
          apply_end = experience.index("\n\n  const submit = async () => {", apply_start)
          apply_block = experience[apply_start:apply_end]
          apply_block, count = re.subn(
            r"    if \(result\?\.ok\) \{[\s\S]*?\n    \}",
            """    if (result?.ok) {
              setStatus({
                ok: true,
                message: `${assignment.location.name} matches its saved standard and is counted.`,
              });
              setView('review');
            }""",
            apply_block,
            count=1,
          )
          if count != 1:
            raise SystemExit('Could not update applyDefault success flow')
          experience = experience[:apply_start] + apply_block + experience[apply_end:]

          submit_start = experience.index("  const submit = async () => {")
          submit_end = experience.index("\n\n  if (loading)", submit_start)
          submit_block = experience[submit_start:submit_end]
          submit_block = submit_block.replace(
            "      setStatus({ ok: true, message: `${assignment.location.name} was sent to Bobby and is now read-only.` });\n      setView('progress');",
            "      setStatus({ ok: true, message: `${assignment.location.name} was sent to Bobby. Your next location is ready.` });\n      setView('home');",
          )
          experience = experience[:submit_start] + submit_block + experience[submit_end:]

          old_count_entry = r'''            <details className="counter-experience-location-guide mesh-panel">
              <summary>
                <span>Visual standard</span>
                <strong>Show how this location should look</strong>
              </summary>
              <LocationReferenceViewer
                locationName={assignment.location.name}
                guidance={assignment.referenceGuidance || { locationId: assignment.location.id }}
              />
            </details>

            {!readOnly ? (
              <ExactStandardPanel
                assignment={assignment}
                summary={summary}
                physicalConfirmation={physicalConfirmation}
                busy={Boolean(busyId)}
                onPhysicalConfirmation={setPhysicalConfirmation}
                onApply={applyDefault}
              />
            ) : null}'''

          new_count_entry = r'''            {!readOnly && !countComplete ? (
              <StandardMatchPanel
                assignment={assignment}
                summary={summary}
                busy={Boolean(busyId)}
                onApply={applyDefault}
                onManualCount={() => {
                  const targetId = summary.incomplete[0]?.id || '';
                  setActiveLineId(targetId);
                  window.requestAnimationFrame(() => {
                    document.getElementById(`counter-line-${targetId}`)?.scrollIntoView({
                      behavior: 'smooth',
                      block: 'center',
                    });
                  });
                }}
              />
            ) : null}

            <details className="counter-experience-location-guide mesh-panel">
              <summary>
                <span>Visual standard</span>
                <strong>Show how this location should look</strong>
              </summary>
              <LocationReferenceViewer
                locationName={assignment.location.name}
                guidance={assignment.referenceGuidance || { locationId: assignment.location.id }}
              />
            </details>'''

          if old_count_entry not in experience:
            raise SystemExit('Could not find Count view standard/guide block')
          experience = experience.replace(old_count_entry, new_count_entry, 1)
          experience_path.write_text(experience)

          styles_path = Path('src/components/InventoryCounterExperience.css')
          styles = styles_path.read_text()
          marker = '/* One-tap saved-standard decision */'
          if marker not in styles:
            styles += r'''

          /* One-tap saved-standard decision */
          .counter-experience-standard-decision {
            display: grid;
            gap: 20px;
            margin-top: 16px;
            padding: clamp(24px, 4vw, 42px);
            border: 1px solid rgba(214, 166, 93, 0.34);
            background:
              radial-gradient(circle at 92% 0%, rgba(214, 166, 93, 0.2), transparent 34%),
              var(--mesh-cream-strong);
            color: var(--counter-cream-ink);
            box-shadow: var(--mesh-shadow-strong);
          }

          .counter-experience-standard-decision-heading {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 22px;
          }

          .counter-experience-standard-decision h2 {
            max-width: 760px;
            margin: 7px 0 0;
            color: var(--counter-cream-ink);
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 0.98;
            letter-spacing: -0.06em;
          }

          .counter-experience-standard-decision p {
            max-width: 760px;
            margin: 16px 0 0;
            color: var(--counter-cream-muted);
            line-height: 1.62;
          }

          .counter-experience-standard-mark {
            display: grid;
            place-items: center;
            width: 58px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #1d1a16;
            color: var(--mesh-cream-strong);
            font-size: 1.35rem;
            font-weight: 900;
          }

          .counter-experience-standard-actions {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
            gap: 10px;
          }

          .counter-experience-standard-actions .mesh-primary-action,
          .counter-experience-standard-actions .mesh-secondary-action {
            width: 100%;
            min-height: 58px;
            padding: 0 18px;
          }

          .counter-experience-standard-decision > small {
            color: var(--counter-cream-muted);
            line-height: 1.55;
          }

          .counter-experience-standard-decision .counter-experience-inline-warning {
            margin: 0;
            border-color: rgba(123, 92, 47, 0.28);
            background: rgba(123, 92, 47, 0.08);
            color: #6e4d20 !important;
          }

          @media (max-width: 620px) {
            .counter-experience-standard-decision-heading,
            .counter-experience-standard-actions {
              grid-template-columns: 1fr;
            }

            .counter-experience-standard-mark {
              grid-row: 1;
              width: 50px;
            }
          }
          '''
          styles_path.write_text(styles)

          verifier_path = Path('scripts/verify-inventory-counter-experience.mjs')
          verifier = verifier_path.read_text()
          insertion = r'''

          // The original Stock Count product promise: saved standards make a matching fridge a one-tap count.
          assert.match(experience, /function StandardMatchPanel/);
          assert.match(experience, /Done — \$\{locationKind\} matches standard/);
          assert.match(experience, /No — count differences/);
          assert.match(experience, /By tapping Done, you confirm that you physically checked this entire \{locationKind\}/);
          assert.match(experience, /one tap counts this \{locationKind\} and opens Review/);
          assert.match(experience, /message: `\$\{assignment\.location\.name\} matches its saved standard and is counted\.`/);
          assert.match(experience, /setView\('review'\)/);
          assert.match(experience, /Your next location is ready/);
          assert.match(experience, /setView\('home'\)/);
          assert.doesNotMatch(experience, /<ExactStandardPanel/);
          assert.doesNotMatch(experience, /I physically checked this entire location/);
          assert.doesNotMatch(experience, /Apply exact targets to eligible products/);
          assert.doesNotMatch(experience, /type="checkbox"[\s\S]*?saved standard/);
          assert.match(styles, /One-tap saved-standard decision/);
          assert.match(styles, /counter-experience-standard-actions/);
          '''
          anchor = "\nassert.match(experience, /const operationRef = useRef\\(''\\)/);"
          if insertion.strip() not in verifier:
            if anchor not in verifier:
              raise SystemExit('Could not find verifier insertion anchor')
            verifier = verifier.replace(anchor, insertion + anchor, 1)
          verifier = verifier.replace(
            "Verified location-scoped Count / Progress / Review experience and preserved inventory integrity controls.",
            "Verified location-scoped, saved-standard-first Count Mode and preserved inventory integrity controls.",
          )
          verifier_path.write_text(verifier)
          PY

      - run: npm ci
      - run: npm run verify:inventory-counter-experience
      - run: npm run verify:inventory-counter-workflow
      - run: npm run verify:inventory-counter-mobile
      - run: npm run build

      - name: Commit verified upgrade
        shell: bash
        run: |
          git config user.name "Bobby"
          git config user.email "118303001+Sillyquack@users.noreply.github.com"
          git add src/components/InventoryCounterExperience.jsx src/components/InventoryCounterExperience.css scripts/verify-inventory-counter-experience.mjs
          git commit -m "fix: make saved fridge standards the primary count path"
          git push origin HEAD:agent/production-candidate-experience
