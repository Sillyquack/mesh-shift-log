name: Temporary Inventory Count experience check

on:
  push:
    branches:
      - agent/inventory-counter-experience

permissions:
  contents: read

jobs:
  verify-count-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify inherited experience foundations
        run: |
          npm run verify:julie-event-routines
          npm run verify:event-operator-experience
          npm run verify:mesh-experience-system

      - name: Verify focused Count Mode
        run: npm run verify:inventory-counter-experience

      - name: Collect routed inventory source verifier results
        shell: bash
        run: |
          set +e
          status=0
          for check in \
            verify:inventory-counter-workflow \
            verify:inventory-counter-replacement \
            verify:inventory-counter-mobile \
            verify:inventory-session-location-scope \
            verify:inventory-confirmation-dialog \
            verify:inventory-variance-notes \
            verify:inventory-millum-export \
            verify:inventory-shelf-storage-guidance \
            verify:inventory-history-detail \
            verify:inventory-simplicity
          do
            npm run "$check" || status=1
          done
          exit "$status"

      - name: Provision Supabase verifier image
        run: |
          docker pull supabase/postgres:17.6.1.141
          docker tag supabase/postgres:17.6.1.141 public.ecr.aws/supabase/postgres:17.6.1.141

      - name: Run complete Phase 9 verification
        run: npm run verify:phase9-all
