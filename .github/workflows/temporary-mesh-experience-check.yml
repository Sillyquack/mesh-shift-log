name: Temporary Mesh Experience check

on:
  push:
    branches:
      - agent/mesh-experience-system

permissions:
  contents: read

jobs:
  verify-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Julie event routines
        run: npm run verify:julie-event-routines

      - name: Verify Event Mode
        run: npm run verify:event-operator-experience

      - name: Verify Mesh experience system
        run: npm run verify:mesh-experience-system

      - name: Provision routine verifier database image
        run: docker pull public.ecr.aws/supabase/postgres:17.6.1.141

      - name: Verify routine employee UI contracts
        run: npm run verify:routine-employee-ui

      - name: Verify routine offline contracts
        run: npm run verify:routine-sync-offline

      - name: Build production bundle
        run: npm run build
