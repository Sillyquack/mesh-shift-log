name: Temporary production candidate check

on:
  push:
    branches:
      - agent/production-candidate-experience

permissions:
  contents: read

jobs:
  verify-production-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production candidate experience
        run: npm run verify:production-candidate-experience

      - name: Verify inherited frontline experiences
        run: |
          npm run verify:auth-password-security
          npm run verify:julie-event-routines
          npm run verify:event-operator-experience
          npm run verify:mesh-experience-system
          npm run verify:inventory-counter-experience

      - name: Provision disposable Supabase verifier image
        run: |
          docker pull supabase/postgres:17.6.1.141
          docker tag supabase/postgres:17.6.1.141 public.ecr.aws/supabase/postgres:17.6.1.141

      - name: Verify manager, visual and history contracts
        run: |
          npm run verify:routine-manager-ui
          npm run verify:routine-reference-images
          npm run verify:routine-history-pilot
          npm run verify:routine-ui-foundation

      - name: Build production bundle
        run: npm run build
