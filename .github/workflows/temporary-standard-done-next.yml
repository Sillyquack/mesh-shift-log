name: Temporary standard done-and-next verification

on:
  push:
    branches:
      - agent/production-candidate-experience

permissions:
  contents: write

jobs:
  upgrade:
    if: "${{ github.event.head_commit.message == 'ci: retry standard done-and-next flow' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-candidate-experience
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make Done count, submit and advance the refrigerator
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          experience_path = Path('src/components/InventoryCounterExperience.jsx')
          experience = experience_path.read_text()

          old_copy = 'one tap counts this {locationKind} and opens Review.'
          old_button = "{busy ? 'Counting…' : `Done — ${locationKind} matches standard`}"
          old_attestation = (
            'By tapping Done, you confirm that you physically checked this entire {locationKind}. '
            'The same product in another fridge remains a separate count.\n'
            '        Existing saved values, notes and deviations are never overwritten.'
          )
          for marker in [old_copy, old_button, old_attestation]:
            if marker not in experience:
              raise SystemExit(f'Missing Count Mode source marker: {marker}')

          experience = experience.replace(
            old_copy,
            'one tap counts and sends this {locationKind} for manager review, then opens the next assigned location.',
            1,
          )
          experience = experience.replace(
            old_button,
            "{busy ? 'Counting & sending…' : `Done — count & next ${locationKind}`}",
            1,
          )
          experience = experience.replace(
            old_attestation,
            'By tapping Done, you confirm that you physically checked this entire {locationKind}. '
            'This {locationKind} is counted at its saved standard and submitted for manager review. '
            'The same product in another fridge remains a separate count.\n'
            '        Existing saved values, notes and deviations are never overwritten.',
            1,
          )

          replacement = r'''  const applyDefault = async () => {
            if (operationRef.current) return;
            const operationId = 'default-submit';
            operationRef.current = operationId;
            setBusyId(operationId);
            setStatus(null);
            try {
              if (!(await requestWriteAccess())) {
                setStatus({
                  ok: false,
                  mode: 'auth_required',
                  message: 'Your Stock Count sign-in could not be verified. No refrigerator count was changed.',
                });
                return;
              }

              const applied = await applyInventoryCounterRefrigeratorDefault({
                assignmentId: assignment.id,
                physicalConfirmation: true,
                expectedAssignmentRevision: assignment.revision,
              });
              if (!applied.ok) {
                setStatus(applied);
                return;
              }

              const workspace = await loadInventoryCounterWorkspace();
              if (!workspace.ok) {
                setStatus({
                  ok: false,
                  mode: workspace.mode || 'sync_error',
                  message: `${assignment.location.name} was counted from its saved standard, but the app could not confirm the handoff. Refresh safely before continuing; no count was lost.`,
                });
                setView('review');
                return;
              }

              const updatedAssignment = workspace.assignments.find((item) => item.id === assignment.id);
              if (!updatedAssignment) {
                setStatus({
                  ok: false,
                  mode: 'sync_error',
                  message: `${assignment.location.name} was counted, but its refreshed assignment could not be found. Refresh safely before continuing; no count was lost.`,
                });
                setView('home');
                return;
              }

              setAssignments(workspace.assignments);
              setDrafts((current) => reconcileCounterDrafts(current, workspace.assignments));
              setSelectedId(updatedAssignment.id);

              const remaining = updatedAssignment.lines.filter((line) => line.countStatus !== 'counted');
              if (remaining.length) {
                setActiveLineId(remaining[0].id);
                setStatus({
                  ok: true,
                  mode: 'manual_count_required',
                  message: `${remaining.length} ${remaining.length === 1 ? 'product does' : 'products do'} not use the saved exact standard. Count only the remaining differences.`,
                });
                setView('count');
                return;
              }

              const submitted = await submitInventoryCountAssignment({
                assignmentId: updatedAssignment.id,
                expectedAssignmentRevision: updatedAssignment.revision,
                expectedSessionUpdatedAt: updatedAssignment.session.updatedAt,
              });
              if (!submitted.ok) {
                setStatus({
                  ...submitted,
                  message: `${updatedAssignment.location.name} is counted, but was not sent for manager review. Open Review and retry the handoff; no count was lost.`,
                });
                setView('review');
                return;
              }

              await refresh();
              setActiveLineId('');
              setStatus({
                ok: true,
                message: `${updatedAssignment.location.name} was counted and sent for manager review. Your next location is ready.`,
              });
              setView('home');
            } catch (error) {
              setStatus({
                ok: false,
                mode: 'sync_error',
                message: error?.message || 'The saved-standard count could not be completed. Refresh safely before retrying.',
              });
            } finally {
              operationRef.current = '';
              setBusyId('');
            }
          };'''

          experience, count = re.subn(
            r"  const applyDefault = async \(\) => \{[\s\S]*?\n  \};\n\n  const submit = async",
            replacement + "\n\n  const submit = async",
            experience,
            count=1,
          )
          if count != 1:
            raise SystemExit(f'Expected one applyDefault replacement, got {count}')
          experience_path.write_text(experience)

          verifier_path = Path('scripts/verify-inventory-counter-experience.mjs')
          verifier = verifier_path.read_text()
          verifier_replacements = [
            (
              r'''assert.match(experience, /Done — \${locationKind} matches standard/);''',
              r'''assert.match(experience, /Done — count & next \${locationKind}/);''',
            ),
            (
              r'''assert.match(experience, /one tap counts this \{locationKind\} and opens Review/);''',
              r'''assert.match(experience, /one tap counts and sends this \{locationKind\} for manager review, then opens the next assigned location/);''',
            ),
            (
              r'''assert.match(experience, /message: `\${assignment\.location\.name} matches its saved standard and is counted\.`/);''',
              r'''assert.match(experience, /const applied = await applyInventoryCounterRefrigeratorDefault/);
          assert.match(experience, /const workspace = await loadInventoryCounterWorkspace/);
          assert.match(experience, /const submitted = await submitInventoryCountAssignment/);
          assert.match(experience, /expectedAssignmentRevision: updatedAssignment\.revision/);
          assert.match(experience, /expectedSessionUpdatedAt: updatedAssignment\.session\.updatedAt/);
          assert.match(experience, /Your next location is ready/);
          assert.match(experience, /no count was lost/);''',
            ),
          ]
          for old, new in verifier_replacements:
            if old not in verifier:
              raise SystemExit(f'Missing Count Mode verifier marker: {old}')
            verifier = verifier.replace(old, new, 1)
          verifier_path.write_text(verifier)

          workflow_path = Path('scripts/verify-inventory-counter-workflow.mjs')
          workflow = workflow_path.read_text()
          old_workflow_assertion = r'''  assert.match(counterExperience, /Done — \${locationKind} matches standard/);'''
          new_workflow_assertions = r'''  assert.match(counterExperience, /Done — count & next \${locationKind}/);
            assert.match(counterExperience, /const applied = await applyInventoryCounterRefrigeratorDefault/);
            assert.match(counterExperience, /const workspace = await loadInventoryCounterWorkspace/);
            assert.match(counterExperience, /const submitted = await submitInventoryCountAssignment/);
            assert.match(counterExperience, /expectedAssignmentRevision: updatedAssignment\.revision/);
            assert.match(counterExperience, /expectedSessionUpdatedAt: updatedAssignment\.session\.updatedAt/);'''
          if old_workflow_assertion not in workflow:
            raise SystemExit(f'Missing workflow verifier marker: {old_workflow_assertion}')
          workflow = workflow.replace(old_workflow_assertion, new_workflow_assertions, 1)
          workflow_path.write_text(workflow)
          PY

      - run: npm ci
      - run: npm run verify:inventory-counter-experience
      - run: npm run verify:inventory-counter-workflow
      - run: npm run verify:inventory-counter-mobile
      - run: npm run verify:inventory-confirmation-dialog
      - run: npm run build

      - name: Commit verified flow and remove this workflow
        shell: bash
        run: |
          git config user.name "Bobby"
          git config user.email "118303001+Sillyquack@users.noreply.github.com"
          git rm .github/workflows/temporary-standard-done-next.yml
          git add src/components/InventoryCounterExperience.jsx scripts/verify-inventory-counter-experience.mjs scripts/verify-inventory-counter-workflow.mjs
          git commit -m "fix: count and advance matching refrigerators in one tap"
          git push origin HEAD:agent/production-candidate-experience
