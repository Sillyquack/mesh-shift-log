name: Temporary one-tap fridge standard runner

on:
  push:
    branches:
      - agent/production-candidate-experience

permissions:
  contents: write

jobs:
  upgrade:
    if: "${{ github.event.head_commit.message == 'ci: finalize one-tap fridge standard upgrade' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-candidate-experience
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Execute the reviewed one-tap patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temporary-one-tap-fridge-standard.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch_code = textwrap.dedent(workflow[start:end])
          patch_code = patch_code.replace("old_count_entry = r'''", "old_count_entry = '''")
          patch_code = patch_code.replace("new_count_entry = r'''", "new_count_entry = '''")
          original = """if old_count_entry not in experience:
            raise SystemExit('Could not find Count view standard/guide block')
          experience = experience.replace(old_count_entry, new_count_entry, 1)"""
          fallback = """if old_count_entry in experience:
            experience = experience.replace(old_count_entry, new_count_entry, 1)
          else:
            count_view_start = experience.index(\"        {view === 'count' ? (\")
            block_start = experience.index(
              '            <details className=\"counter-experience-location-guide mesh-panel\">',
              count_view_start,
            )
            block_end = experience.index(
              '\\n\\n            {countComplete ? (',
              block_start,
            )
            experience = experience[:block_start] + new_count_entry + experience[block_end:]"""
          if original not in patch_code:
            raise SystemExit('Could not patch the embedded Count-view replacement logic')
          patch_code = patch_code.replace(original, fallback, 1)
          exec(compile(patch_code, 'one-tap-fridge-standard-patch', 'exec'))
          PY

      - run: npm ci
      - run: npm run verify:inventory-counter-experience
      - run: npm run verify:inventory-counter-workflow
      - run: npm run verify:inventory-counter-mobile
      - run: npm run build

      - name: Commit verified upgrade and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Bobby"
          git config user.email "118303001+Sillyquack@users.noreply.github.com"
          git rm .github/workflows/temporary-one-tap-fridge-standard.yml
          git rm .github/workflows/temporary-one-tap-fridge-standard-runner.yml
          git add src/components/InventoryCounterExperience.jsx src/components/InventoryCounterExperience.css scripts/verify-inventory-counter-experience.mjs
          git commit -m "fix: make saved fridge standards the primary count path"
          git push origin HEAD:agent/production-candidate-experience
