name: Temporary one-tap fridge standard runner

on:
  push:
    branches:
      - agent/production-candidate-experience

permissions:
  contents: write

jobs:
  upgrade:
    if: "${{ github.event.head_commit.message == 'ci: run one-tap fridge standard upgrade' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-candidate-experience
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Execute the reviewed one-tap patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temporary-one-tap-fridge-standard.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch_code = textwrap.dedent(workflow[start:end])
          exec(compile(patch_code, 'one-tap-fridge-standard-patch', 'exec'))
          PY

      - run: npm ci
      - run: npm run verify:inventory-counter-experience
      - run: npm run verify:inventory-counter-workflow
      - run: npm run verify:inventory-counter-mobile
      - run: npm run build

      - name: Commit verified upgrade and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Bobby"
          git config user.email "118303001+Sillyquack@users.noreply.github.com"
          git rm .github/workflows/temporary-one-tap-fridge-standard.yml
          git rm .github/workflows/temporary-one-tap-fridge-standard-runner.yml
          git add src/components/InventoryCounterExperience.jsx src/components/InventoryCounterExperience.css scripts/verify-inventory-counter-experience.mjs
          git commit -m "fix: make saved fridge standards the primary count path"
          git push origin HEAD:agent/production-candidate-experience
