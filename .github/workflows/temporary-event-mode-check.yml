name: Temporary Event Mode check

on:
  pull_request:
    branches:
      - phase-9a-inventory-par-levels-stocktaking

permissions:
  contents: read

jobs:
  verify-event-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Julie event routines
        run: npm run verify:julie-event-routines

      - name: Verify Event Mode experience
        run: npm run verify:event-operator-experience

      - name: Build production bundle
        run: npm run build
